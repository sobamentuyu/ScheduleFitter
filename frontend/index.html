<!doctype html>
<html lang="ja" data-theme="purple">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>ScheduleFitter</title>
    <script>
      // React 起動前に適用する。キーと許可値は frontend/src/constants/theme.ts と揃える
      try {
        const theme = localStorage.getItem("schedulefitter-theme");
        const allowed = ["blue", "green", "red", "pink", "purple", "orange", "yellow"];
        if (allowed.includes(theme)) {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
