services:
  # PostgreSQL データベース
  db:
    image: postgres:16-alpine
    container_name: schedulefitter-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: schedulefitter
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/user.sql:ro
    # ...

  # PHP バックエンド (Apache)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schedulefitter-backend
    ports:
      - '8080:80'
    volumes:
      - ./backend:/var/www/html
    environment:
      IS_DOCKER: 'true'
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: schedulefitter
      DB_USERNAME: postgres
      DB_PASSWORD: password
    depends_on:
      - db

  # React フロントエンド (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: schedulefitter-frontend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  db-data:
